name: Release

# Bumps the version from the conventional-commit history, then builds and publishes the
# macOS artefacts in the same run. Bump and build are one workflow on purpose: a tag
# pushed with GITHUB_TOKEN does not trigger other workflows, so a separate tag-triggered
# build would never fire.
#
# The build is unsigned. Testers install with the curl line in the README, which keeps
# the quarantine attribute off (it is set by browsers, not by curl), so the app opens
# without the Gatekeeper "damaged" dialog. See docs/install.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: "Force an increment instead of reading the commits"
        required: false
        type: choice
        options: ["", PATCH, MINOR, MAJOR]
        default: ""

permissions:
  contents: write

jobs:
  release:
    # Never release off a red CI run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # cz exits non-zero when no commit since the last tag warrants a release, which is
      # the normal case for a docs-only push: stop quietly rather than failing the run.
      - name: Bump the version
        id: bump
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if uvx --from commitizen cz bump --yes ${{ inputs.increment && format('--increment {0}', inputs.increment) || '' }}; then
            echo "version=$(uvx --from commitizen cz version --project)" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release needed (was $before)"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the bump and its tag
        if: steps.bump.outputs.bumped == 'true'
        run: git push --follow-tags origin main

      - name: Build the CLI
        if: steps.bump.outputs.bumped == 'true'
        run: cargo build -p dnagent-cli --release --locked

      - name: Build the desktop app
        if: steps.bump.outputs.bumped == 'true'
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build

      # `tauri build` has exited 0 after failing to bundle (a bad bundle.category did
      # exactly that), so check the artefacts exist rather than trusting the status.
      - name: Package
        if: steps.bump.outputs.bumped == 'true'
        id: package
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          app=desktop/src-tauri/target/release/bundle/macos/DNAgent.app
          cli=target/release/dnagent
          test -d "$app" || { echo "::error::no app bundle at $app"; exit 1; }
          test -x "$cli" || { echo "::error::no CLI binary at $cli"; exit 1; }
          mkdir -p dist
          # No version in the name: /releases/latest/download/<name> needs a stable
          # filename, and that is the URL the install instructions use.
          tar -czf "dist/DNAgent-macos-arm64.tar.gz" -C "$(dirname "$app")" DNAgent.app
          tar -czf "dist/dnagent-cli-macos-arm64.tar.gz" -C "$(dirname "$cli")" dnagent
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg dist/ || true
          (cd dist && shasum -a 256 * > SHA256SUMS)
          ls -la dist

      - name: Publish
        if: steps.bump.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: DNAgent v${{ steps.bump.outputs.version }}
          body: |
            Apple Silicon macOS build. **Unsigned** — install with the command below, which
            downloads with `curl` and so never sets the quarantine attribute that makes
            macOS call an unsigned app "damaged".

            ```bash
            curl -fsSL https://github.com/HocheggerLab/DNAgent/releases/latest/download/DNAgent-macos-arm64.tar.gz | tar xz -C /Applications
            ```

            The `dnagent` command-line tool, which agents use:

            ```bash
            curl -fsSL https://github.com/HocheggerLab/DNAgent/releases/latest/download/dnagent-cli-macos-arm64.tar.gz | tar xz -C /usr/local/bin
            ```

            If you download the `.dmg` in a browser instead, clear the quarantine flag once:
            `xattr -dr com.apple.quarantine /Applications/DNAgent.app`

            Full setup, including the agent connection: [docs/install.md](https://github.com/HocheggerLab/DNAgent/blob/main/docs/install.md).
            Changes: [CHANGELOG.md](https://github.com/HocheggerLab/DNAgent/blob/main/CHANGELOG.md).

            DNAgent predicts sequences and products; it does not validate experiments.
            Check designs before ordering.
          files: dist/*
          generate_release_notes: false
