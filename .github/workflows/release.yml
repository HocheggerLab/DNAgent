name: Release

# Bumps the version from the conventional-commit history, builds macOS and Windows from
# that exact tag, then publishes both. Bump and build live in one workflow run on
# purpose: a tag pushed with GITHUB_TOKEN does not trigger other workflows, so a separate
# tag-triggered build would never fire.
#
# Check CI is green on main before running this: nothing here re-runs the tests.
#
# Neither build is code-signed. macOS testers install with the curl line, which keeps the
# quarantine attribute off; Windows testers click through one SmartScreen warning. See
# docs/install.md.

# Deliberately manual: run it from the Actions tab when you mean to put a build in
# testers' hands, not as a side effect of merging. Add the `workflow_run` trigger below
# once the cadence settles, and releases follow every green CI run on main.
on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Force an increment instead of reading the commits"
        required: false
        type: choice
        options: ["", PATCH, MINOR, MAJOR]
        default: ""

permissions:
  contents: write

jobs:
  bump:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      # `.cz.toml`'s pre-bump hook runs `cargo update --offline` to refresh the lockfiles
      # after the version strings change. Offline needs the registry already on disk, so
      # fetch it first; without this the hook fails to resolve serde and aborts the bump.
      - name: Populate the cargo registry for the bump hook
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml

      # Deciding and doing are separate on purpose. `cz bump` exits non-zero both when
      # there is nothing to release and when the bump itself breaks; conflating them once
      # reported a broken hook as "no release needed" and silently skipped the build.
      - name: Is there anything to release?
        id: check
        run: |
          if uvx --from commitizen cz bump --dry-run --yes ${{ inputs.increment && format('--increment {0}', inputs.increment) || '' }} >/dev/null 2>&1; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing since the last tag warrants a release."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
      # No `if:` guard on failure here: from this point any error is a real one.
      - name: Bump the version
        id: bump
        if: steps.check.outputs.bumped == 'true'
        run: |
          uvx --from commitizen cz bump --yes ${{ inputs.increment && format('--increment {0}', inputs.increment) || '' }}
          echo "version=$(uvx --from commitizen cz version --project)" >> "$GITHUB_OUTPUT"
          git push --follow-tags origin main

  build:
    name: Build ${{ matrix.name }}
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
            app: DNAgent-macos-arm64.tar.gz
            cli: dnagent-cli-macos-arm64.tar.gz
          - os: windows-latest
            name: Windows (x64)
            app: DNAgent-windows-x64-setup.exe
            cli: dnagent-cli-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag the bump job just pushed, not whatever main is by now.
          ref: v${{ needs.bump.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: cargo build -p dnagent-cli --release --locked
      - run: npm ci
        working-directory: desktop
      - run: npm run tauri build
        working-directory: desktop

      # `tauri build` has exited 0 after failing to bundle (a bad bundle.category did
      # exactly that), so check the artefacts exist rather than trusting the status.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=desktop/src-tauri/target/release/bundle/macos/DNAgent.app
          test -d "$app" || { echo "::error::no app bundle at $app"; exit 1; }
          test -x target/release/dnagent || { echo "::error::no CLI binary"; exit 1; }
          mkdir -p dist
          tar -czf "dist/${{ matrix.app }}" -C "$(dirname "$app")" DNAgent.app
          tar -czf "dist/${{ matrix.cli }}" -C target/release dnagent
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg dist/ || true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          setup=$(find desktop/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -1)
          test -n "$setup" || { echo "::error::no NSIS installer"; exit 1; }
          test -f target/release/dnagent.exe || { echo "::error::no CLI binary"; exit 1; }
          mkdir -p dist
          cp "$setup" "dist/${{ matrix.app }}"
          7z a "dist/${{ matrix.cli }}" ./target/release/dnagent.exe

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish
    needs: [bump, build]
    if: needs.bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: Collect and checksum
        run: |
          mkdir -p dist && find staged -type f -exec mv {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: DNAgent v${{ needs.bump.outputs.version }}
          body: |
            Neither build is code-signed; both are produced by [a public workflow](https://github.com/HocheggerLab/DNAgent/blob/main/.github/workflows/release.yml) from the commit this tag names, with SHA-256 checksums attached.

            ### macOS (Apple Silicon)

            Install with `curl`, **not** a browser download: `curl` does not set the quarantine attribute that makes macOS call an unsigned app "damaged".

            ```bash
            curl -fsSL https://github.com/HocheggerLab/DNAgent/releases/latest/download/DNAgent-macos-arm64.tar.gz | tar xz -C /Applications
            curl -fsSL https://github.com/HocheggerLab/DNAgent/releases/latest/download/dnagent-cli-macos-arm64.tar.gz | tar xz -C /usr/local/bin
            ```

            ### Windows (x64)

            Download `DNAgent-windows-x64-setup.exe` and run it. SmartScreen will warn that the publisher is unknown: **More info → Run anyway**. The `dnagent` command-line tool is in `dnagent-cli-windows-x64.zip`; unzip it somewhere on your `PATH`.

            The live agent connection (`dnagent mcp`) is macOS and Linux only for now — on Windows use the file handoff through the workspace folder.

            Full instructions: [docs/install.md](https://github.com/HocheggerLab/DNAgent/blob/main/docs/install.md).
            Changes: [CHANGELOG.md](https://github.com/HocheggerLab/DNAgent/blob/main/CHANGELOG.md).

            DNAgent predicts sequences and products; it does not validate experiments. Check designs before ordering.
          files: dist/*
