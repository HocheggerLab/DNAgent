[package]
name = "dnagent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dnagent"
path = "src/main.rs"

[features]
default = []
gui = ["dep:dnagent-gui"]

[dependencies]
clap.workspace = true
dnagent-app = { path = "../dnagent-app" }
dnagent-library = { path = "../dnagent-library" }
dnagent-domain = { path = "../dnagent-domain" }
dnagent-formats = { path = "../dnagent-formats" }
dnagent-gui = { path = "../dnagent-gui", optional = true }
dnagent-render = { path = "../dnagent-render" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
