[package]
name = "dnagent-agent-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server (turbomcp, unix socket) exposing a running DNAgent desktop session to agents"

[dependencies]
dnagent-app = { path = "../dnagent-app" }
dnagent-desktop-api = { path = "../dnagent-desktop-api" }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }
turbomcp = { version = "3.1.5", default-features = false }
turbomcp-server = { version = "3.1.5", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true

# The unix socket transport only exists on unix; the server, its macros and the tool
# schemas are portable, so Windows builds the crate and `serve` reports that the live
# channel is unavailable there.
[target.'cfg(unix)'.dependencies]
turbomcp = { version = "3.1.5", default-features = false, features = ["unix"] }
turbomcp-server = { version = "3.1.5", default-features = false, features = ["unix"] }
